name: buscobien
description: Red social de participación ciudadana — BuscoBien.
publish_to: "none"

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ">=3.2.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9

  # Estado
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^4.0.2

  # HTTP y API
  dio: ^5.9.2 # Cliente HTTP con interceptores
  http: ^1.6.0 # HTTP simple (utilidades)

  # Variables de entorno
  flutter_dotenv: ^5.1.0 # Carga .env en todas las plataformas

  # Autenticación y almacenamiento local
  shared_preferences: ^2.5.4 # Token JWT — Web y Windows
  flutter_secure_storage: ^10.0.0 # Token JWT seguro — iOS y Android
  encrypt: ^5.0.3
  crypto: ^3.0.7

  # Mapas y geolocalización
  google_maps_flutter: ^2.14.0
  google_maps_flutter_web: ^0.5.14+3
  google_maps_flutter_platform_interface: ^2.14.1
  google_maps_flutter_android: ^2.18.6
  geolocator: ^14.0.2 # GPS (iOS, Android, Web, Windows)
  geocoding: ^4.0.0 # Coordenadas → direcciones legibles

  # Imágenes y archivos adjuntos
  image_picker: ^1.1.2 # Cámara y galería (iOS, Android, Web)
  file_picker: ^10.3.8 # Explorador de archivos (Windows, Web)
  flutter_image_compress: ^2.4.0
  image: 4.5.4
  cached_network_image: ^3.4.1 # Caché de imágenes remotas
  path_provider: ^2.1.5
  open_filex: ^4.7.0

  # Notificaciones
  flutter_local_notifications: ^18.0.0 # Notificaciones locales (Windows + fallback)

  # UI y experiencia
  flutter_svg: ^2.0.10+1 # Íconos SVG
  timeago: ^3.6.1 # "hace 5 minutos"
  intl: ^0.19.0 # Fechas y formato en español
  shimmer: ^3.0.0 # Skeleton loaders mientras carga
  carousel_slider: ^5.1.1
  smooth_page_indicator: ^2.0.1
  buttons_tabbar: ^1.3.15

  # Utilidades
  uuid: ^4.5.1 # Generación de UUIDs
  connectivity_plus: ^7.0.0 # Detectar conexión a internet
  url_launcher: ^6.3.2 # Abrir URLs externas
  url_strategy: ^0.3.0
  app_links: ^6.4.0
  json_annotation: ^4.9.0
  freezed_annotation: ^3.1.0

  # PDF
  pdf: ^3.10.8
  printing: ^5.14.2
  material_symbols_icons: ^4.2928.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^4.0.3 # Generación de código Riverpod
  riverpod_lint: ^3.0.3
  freezed: ^3.2.5
  build_runner: any
  build_test: any
  json_serializable: ^6.13.0

flutter:
  uses-material-design: true

  assets:
    - .env # Variables de entorno (flutter_dotenv)
    - assets/
    - assets/images/
    - assets/icon/
    - assets/aviso_privacidad.pdf
    - assets/terminos_condiciones.pdf

  fonts:
    - family: Urbanist
      fonts:
        - asset: fonts/Urbanist-Light.ttf
        - asset: fonts/Urbanist-Medium.ttf
        - asset: fonts/Urbanist-Regular.ttf
        - asset: fonts/Urbanist-SemiBold.ttf
        - asset: fonts/Urbanist-Bold.ttf
    - family: Comfortaa
      fonts:
        - asset: fonts/Comfortaa-Light.ttf
        - asset: fonts/Comfortaa-Medium.ttf
        - asset: fonts/Comfortaa-Regular.ttf
        - asset: fonts/Comfortaa-SemiBold.ttf
        - asset: fonts/Comfortaa-Bold.ttf
