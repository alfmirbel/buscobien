<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arquitectura de Navegación Interactiva</title>
    <!-- Tailwind CSS para estilos rápidos y modernos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Iconos Phosphor -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Fuente Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        slate: { 850: '#151e2e', 900: '#0f172a', 950: '#020617' }
                    }
                }
            }
        }
    </script>
    <style>
        /* Personalizaciones suaves para scrollbars y hover */
        body { background-color: #020617; color: #e2e8f0; }
        .tree-node { transition: all 0.2s ease; }
        .tree-item:hover { background-color: #1e293b; border-left: 3px solid #6366f1; }
        .tree-item.active { background-color: #1e293b; border-left: 3px solid #6366f1; color: #fff; }
        
        /* Animación de entrada */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="h-screen flex overflow-hidden font-sans antialiased selection:bg-indigo-500 selection:text-white">

    <!-- Sidebar: Navegación de Árbol -->
    <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col hidden md:flex">
        <div class="p-6 border-b border-slate-800">
            <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                <i class="ph ph-architecture text-indigo-400"></i>
                Arch. Nav
            </h1>
            <p class="text-xs text-slate-500 mt-2">Estructura del proyecto</p>
        </div>

        <!-- Renderizado dinámico del árbol -->
        <nav id="file-tree" class="flex-1 overflow-y-auto p-2 space-y-1">
            <!-- El contenido se genera con JS -->
        </nav>

        <div class="p-4 border-t border-slate-800 text-xs text-slate-600 text-center">
            v1.0.4 &bull; Generated Live
        </div>
    </aside>

    <!-- Contenido Principal -->
    <main class="flex-1 flex flex-col h-screen relative">
        <!-- Header superior -->
        <header class="h-16 border-b border-slate-800 bg-slate-900/50 backdrop-blur flex items-center justify-between px-8">
            <div id="breadcrumb" class="text-sm text-indigo-400 font-mono">
                <span id="current-path">/root</span>
            </div>
            <div class="flex gap-4">
                <span class="text-xs px-2 py-1 rounded bg-slate-800 border border-slate-700 text-slate-400">
                    <i class="ph ph-code mr-1"></i> Read-Only Mode
                </span>
                <button onclick="resetTree()" class="text-xs px-3 py-1 rounded hover:bg-slate-800 text-slate-400 hover:text-white transition">
                    <i class="ph ph-arrows-clockwise mr-1"></i> Reset
                </button>
            </div>
        </header>

        <!-- Área de visualización de documentación -->
        <div id="content-area" class="flex-1 overflow-y-auto p-8 md:p-12 bg-slate-950 relative">
            <!-- Aquí inyectaremos el contenido -->
        </div>
    </main>

    <script>
        // --- DATOS SIMULADOS (Lo que vendría en tu .md) ---
        // En un caso real, esto vendría de leer el archivo y convertirlo a JSON
        const architectureData = {
            "src": {
                "components": {
                    "Layouts": {
                        "main-layout.tsx": {
                            "content": "<pre class='bg-slate-900 p-4 rounded-lg text-xs font-mono overflow-x-auto text-emerald-300'><code>export default function MainLayout({ children }) {\n  return (\n    &lt;div className='min-h-screen bg-slate-900'&gt;\n      &lt;Header /&gt;\n      &lt;Sidebar /&gt;\n      &lt;main&gt;\n        {children}\n      &lt;/main&gt;\n    &lt;/div&gt;\n  );\n}</code></pre>"
                        },
                        "sidebar-layout.tsx": { "content": "Layout con barra lateral fija." }
                    },
                    "ui": {
                        "Button.tsx": { "content": "Botones semánticos reutilizables." },
                        "Modal.tsx": { "content": "Componente de diálogo accesible." }
                    }
                },
                "lib": {
                    "router.ts": {
                        "content": "<pre class='text-yellow-200 font-mono text-xs overflow-x-auto'><code>import { createBrowserRouter } from 'react-router-dom';\n\nexport const routes = [\n  { path: '/', element: &lt;Home /&gt; },\n  { path: '/users/:id', element: &lt;UserDetail /&gt; },\n];</code></pre>"
                    },
                    "utils.ts": { "content": "Utilidades compartidas para navegación." }
                },
                "pages": {
                    "dashboard.tsx": { "content": "Panel principal con métricas." },
                    "settings.tsx": { "content": "Configuración del usuario." }
                }
            },
            "public": {
                "assets": {
                    "logo.png": { "content": "Imagen del logotipo." }
                }
            },
            "README.md": {
                "content": "<h2 class='text-2xl font-bold text-white mb-4'>Arquitectura de Navegación</h2>\n\n<p class='text-slate-400 mb-4'>Este proyecto utiliza una estructura de archivos de tipo <code>feature-slice</code>.</p>\n\n<ul class='list-disc list-inside text-slate-400 mb-4'>\n  <li><strong>Navegación Programática:</strong> No se usan URLs en componentes de ruta, se usan llamadas a componentes.</li>\n  <li><strong>Lazy Loading:</strong> Todos los componentes se cargan dinámicamente.</li>\n</ul>\n\n<div class='mt-8 p-4 border border-indigo-500/30 bg-indigo-500/10 rounded text-sm text-indigo-200'>\n <strong>Nota Técnica:</strong> El archivo <em>D:\\buscobien\\...\\arquitectura_navegacion.md</em> contiene las especificaciones originales de este árbol.\n</div>"
            }
        };

        // --- LÓGICA DE RENDERIZADO ---

        const treeContainer = document.getElementById('file-tree');
        const contentArea = document.getElementById('content-area');
        const breadcrumbPath = document.getElementById('current-path');

        function createTreeItem(path, data, level = 0) {
            // Renderizar contenido previo si existe (para simular lectura de archivo)
            if (data.content) {
                contentArea.innerHTML = data.content;
            } else {
                // Renderizar árbol recursivo
                let childHtml = '';
                for (const [key, value] of Object.entries(data)) {
                    childHtml += createTreeItem(`${path}/${key}`, value, level + 1);
                }
                
                // Solo si el objeto tiene hijos, lo mostramos como carpeta
                if (Object.keys(data).length > 0) {
                    return `
                        <div class="group">
                            <div class="flex items-center py-1 px-2 rounded cursor-pointer tree-item" id="${path}" onclick="selectNode('${path}')">
                                <i class="ph ph-folder text-slate-500 text-lg mr-2 group-hover:text-indigo-400 transition-colors"></i>
                                <span class="text-sm text-slate-300">${key.replace('.tsx', '').replace('.ts', '')}</span>
                            </div>
                            ${childHtml}
                        </div>
                    `;
                }
            }
            return '';
        }

        function selectNode(path) {
            // Remover clase activa de todos
            document.querySelectorAll('.tree-item').forEach(el => el.classList.remove('active'));
            
            // Añadir a actual
            const node = document.getElementById(path);
            if(node) node.classList.add('active');
            
            // Cambiar breadcrumb
            breadcrumbPath.innerText = path;
        }

        function resetTree() {
            // Reset visual básico
            treeContainer.innerHTML = '';
            contentArea.innerHTML = '<div class="text-center mt-20 text-slate-500"><i class="ph ph-arrows-counter-clockwise text-3xl mb-4 block"></i>Recargando árbol...</div>';
            
            setTimeout(() => {
                treeContainer.innerHTML = createTreeItem('/src', architectureData.src);
                treeContainer.innerHTML += createTreeItem('/public', architectureData.public);
                treeContainer.innerHTML += createTreeItem('/README.md', architectureData["README.md"]);
            }, 500);
        }

        // Iniciar
        resetTree();

    </script>
</body>
</html>
